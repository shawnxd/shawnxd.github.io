<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0d0b" media="(prefers-color-scheme: dark)" />

    <title>Shawn Dong — Software Engineer</title>
    <meta name="description" content="Personal site of Shawn Dong — Software engineer working on large-scale distributed systems, data platforms, and the products that sit on top of them." />
    <meta name="author" content="Shawn Dong" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shawn Dong — Software Engineer" />
    <meta property="og:description" content="Software engineer working on large-scale distributed systems, data platforms, and the products that sit on top of them." />
    <meta property="og:image" content="/images/profile.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shawn Dong — Software Engineer" />
    <meta name="twitter:description" content="Software engineer working on large-scale distributed systems, data platforms, and the products that sit on top of them." />

    <link rel="icon" type="image/svg+xml" href="/images/shawn-logo.svg" />

    <!-- Decode SPA fallback redirect from 404.html before React Router boots. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>

    <!-- Apply saved theme before paint to prevent flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
