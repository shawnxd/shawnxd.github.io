<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />

    <title>Shawn X. Dong — Staff Software Engineer</title>
    <meta name="description" content="Personal site of Shawn X. Dong — Staff software engineer working on large-scale distributed systems, data platforms, and the products that sit on top of them." />
    <meta name="author" content="Shawn X. Dong" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shawn X. Dong — Staff Software Engineer" />
    <meta property="og:description" content="Staff software engineer working on large-scale distributed systems, data platforms, and the products that sit on top of them." />
    <meta property="og:image" content="https://scholar.googleusercontent.com/citations?view_op=medium_photo&user=vJbvaGcAAAAJ&citpid=5" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shawn X. Dong — Staff Software Engineer" />
    <meta name="twitter:description" content="Staff software engineer working on large-scale distributed systems, data platforms, and the products that sit on top of them." />

    <!-- Favicon: inline SVG with initials -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b8541f'/%3E%3Ctext x='32' y='44' font-family='Inter, -apple-system, sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle' letter-spacing='-1'%3ESD%3C/text%3E%3C/svg%3E" />

    <!-- Fonts: Inter (UI) + JetBrains Mono (code) + Source Serif Pro (italic accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+Pro:ital,wght@1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved theme before paint to prevent flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
